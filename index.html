<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroGestão - Criatório Marques</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b3b22">
</head>
<body>

  <!-- CABEÇALHO FIXO NO TOPO (OCUPA 100% DA LARGURA) -->
  <header class="hero-header">
    <div class="hero-container">
      
      <!-- IDENTIDADE DA FAZENDA -->
      <div class="brand-section">
        <div class="brand-logo" id="header-logo">
          <img src="logo.png" alt="Logo Criatório Marques" onerror="this.style.display='none'; this.parentElement.innerText='CM';">
        </div>
        <div class="brand-info">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h1 id="header-nome-fazenda">CRIATÓRIO MARQUES</h1>
            <button class="btn-edit-farm" onclick="abrirModalPerfilFazenda()">⚙️ Editar</button>
          </div>
          <h2>AgroGestão • Serviços da Propriedade</h2>
          <div class="brand-slogan" id="header-slogan">"A VITRINE DO BÔER"</div>
        </div>
      </div>

      <!-- PAINEL DE AÇÕES E CLIMA -->
      <div class="header-widgets">
        <div id="status-conexao" class="status-pill">
          <span id="dot-conexao" class="dot-online"></span>
          <span id="texto-conexao">Online</span>
        </div>

        <button type="button" class="btn-header" onclick="abrirModalAreas()">
          📍 Áreas da Propriedade
        </button>

        <button id="btn-login-perfil" class="btn-header btn-admin" onclick="solicitarAcessoAdmin()">
          🔑 <span id="label-perfil">Entrar como Admin</span>
        </button>

        <div class="weather-card" id="weather-box">
          <div style="font-size: 1.4rem;" id="weather-icon">☀️</div>
          <div>
            <div class="weather-temp" id="clima-temp">--°C</div>
            <div class="weather-details">
              <span id="clima-desc">Carregando...</span>
              <span class="weather-location" id="header-cidade">📍 Belém do São Francisco - PE</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL (ABAIXO DO CABEÇALHO) -->
  <main class="main-container">
    
    <!-- DASHBOARD DE STATUS -->
    <section class="cards-grid">
      <div class="card" id="card-agendados" onclick="filtrarPorStatus('Agendado')">
        <span class="num" id="count-agendados">0</span>
        <span class="label">AGENDADOS</span>
      </div>
      <div class="card" id="card-pendentes" onclick="filtrarPorStatus('Pendente')">
        <span class="num" id="count-pendentes">0</span>
        <span class="label">PENDENTES</span>
      </div>
      <div class="card" id="card-execucao" onclick="filtrarPorStatus('Em execução')">
        <span class="num" id="count-execucao">0</span>
        <span class="label">EM EXECUÇÃO</span>
      </div>
      <div class="card" id="card-concluidos" onclick="filtrarPorStatus('Concluído')">
        <span class="num" id="count-concluidos">0</span>
        <span class="label">CONCLUÍDOS</span>
      </div>
    </section>

    <!-- BARRA DE PESQUISA E BACKUP -->
    <section class="toolbar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="🔍 Buscar por nome, local ou responsável..." oninput="filtrarServicos()">
      </div>
      <div class="backup-actions">
        <button onclick="exportarBackup()" class="btn-secondary">💾 Backup</button>
        <label for="import-file" class="btn-secondary">📅 Importar</label>
        <input type="file" id="import-file" accept=".json" onchange="importarBackup(event)" style="display:none;">
      </div>
    </section>

    <!-- CABEÇALHO DA LISTA -->
    <section class="services-header">
      <h3 id="titulo-lista">Serviços recentes</h3>
      <button class="btn-primary" onclick="abrirModal()">+ Novo Serviço</button>
    </section>

    <!-- LISTA DINÂMICA DE SERVIÇOS -->
    <div id="lista-servicos" class="services-list"></div>
  </main>

  <!-- MODAL / FICHA DE NOVO SERVIÇO -->
  <div id="modal-servico" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📋 Ficha de Serviço</h3>
        <button type="button" class="btn-close" onclick="fecharModal()">✕</button>
      </div>
      <form id="form-servico" onsubmit="salvarServicoFormulario(event)">
        <div class="form-group">
          <label for="nome-servico">Nome do Serviço *</label>
          <input type="text" id="nome-servico" placeholder="Ex: Vacinação Boer, Reparo de Cerca" required>
        </div>
        <div class="form-group">
          <label for="local-servico">Local / Área da Propriedade *</label>
          <input type="text" id="local-servico" list="lista-areas-autocomplete" placeholder="Selecione ou digite um local..." required>
          <datalist id="lista-areas-autocomplete"></datalist>
        </div>
        <div class="form-group">
          <label for="responsavel-servico">Responsável</label>
          <input type="text" id="responsavel-servico" placeholder="Ex: Romerio, Valdenor">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="prioridade-servico">Prioridade</label>
            <select id="prioridade-servico">
              <option value="Normal">Normal</option>
              <option value="Alta">Alta</option>
              <option value="Baixa">Baixa</option>
            </select>
          </div>
        </div>
        <div class="agendamento-box">
          <label>📅 Agendamento Futuro (Opcional)</label>
          <div class="agendamento-inputs">
            <div>
              <label for="data-agendada">Data da Execução:</label>
              <input type="date" id="data-agendada">
            </div>
            <div>
              <label for="hora-agendada">Horário Previsto:</label>
              <input type="time" id="hora-agendada">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="obs-servico">Observações / Orientações</label>
          <textarea id="obs-servico" rows="3" placeholder="Detalhes sobre a tarefa..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar Ficha</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DADOS DA PROPRIEDADE -->
  <div id="modal-perfil-fazenda" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏡 Dados da Propriedade</h3>
        <button type="button" class="btn-close" onclick="fecharModalPerfilFazenda()">✕</button>
      </div>
      <form id="form-perfil-fazenda" onsubmit="salvarPerfilFazenda(event)">
        <div class="form-group">
          <label for="input-nome-fazenda">Nome da Fazenda / Criatório *</label>
          <input type="text" id="input-nome-fazenda" required>
        </div>
        <div class="form-group">
          <label for="input-slogan-fazenda">Slogan / Frase Marcante</label>
          <input type="text" id="input-slogan-fazenda">
        </div>
        <div class="form-group">
          <label for="input-cidade-fazenda">Cidade e Estado *</label>
          <input type="text" id="input-cidade-fazenda" required>
        </div>
        <div class="form-group">
          <label for="input-logo-fazenda">Logomarca / Foto da Propriedade</label>
          <input type="file" id="input-logo-fazenda" accept="image/*" onchange="carregarPreviewLogo(event)">
          <div id="preview-logo-box"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="fecharModalPerfilFazenda()">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar Propriedade</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL ÁREAS DA PROPRIEDADE -->
  <div id="modal-areas" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📍 Áreas da Propriedade</h3>
        <button type="button" class="btn-close" onclick="fecharModalAreas()">✕</button>
      </div>
      <form onsubmit="salvarNovaArea(event)">
        <div class="form-group">
          <label for="nome-area">Nome do Local *</label>
          <input type="text" id="nome-area" placeholder="Ex: Curral, Maternidade, Baia 01" required>
        </div>
        <div class="form-group">
          <label>Foto da Estrutura / Local (Opcional)</label>
          <input type="file" accept="image/*" onchange="carregarFotoArea(event)">
          <div id="preview-foto-area"></div>
        </div>
        <button type="submit" class="btn-primary" style="width:100%; margin-top:10px;">+ Cadastrar Área</button>
      </form>
      <div id="lista-areas-cadastradas" style="margin-top: 15px;"></div>
    </div>
  </div>

  <!-- MODALS DE SUPORTE -->
  <div id="modal-justificativa" class="modal-overlay" style="display: none;"></div>
  <div id="modal-conclusao" class="modal-overlay" style="display: none;"></div>
  <div id="modal-editar-conclusao" class="modal-overlay" style="display: none;"></div>
  <div id="modal-relatorio" class="modal-overlay" style="display: none;"></div>
  <div id="modal-reagendar" class="modal-overlay" style="display: none;"></div>

  <script src="app.js"></script>
</body>
</html>

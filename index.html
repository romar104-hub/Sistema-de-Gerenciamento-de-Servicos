<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criatório Marques - AgroGestão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="header-container">
    <div class="header-left">
      <div class="brand-avatar">CM</div>
      <div class="brand-info">
        <div class="brand-title-row">
          <h1>CRIATÓRIO MARQUES</h1>
          <button type="button" class="btn-tag"><span class="icon">⚙️</span> Editar</button>
        </div>
        <p class="brand-sub">AgroGestão • Serviços da Propriedade</p>
        <p class="brand-slogan">"A VITRINE DO BÔER"</p>
      </div>
    </div>

    <div class="header-right">
      <span class="status-online"><span class="dot"></span> Online</span>
      <button type="button" class="btn-tag"><span class="icon">📍</span> Áreas da Propriedade</button>
      <button type="button" class="btn-tag"><span class="icon">🔑</span> Entrar como Admin</button>
      
      <!-- WIDGET CLIMA -->
      <div class="weather-card">
        <span class="weather-icon">☀️</span>
        <div class="weather-info">
          <span class="weather-temp">-- °C</span>
          <span class="weather-status">Carregando... 📍 Belém do São Francisco - PE</span>
        </div>
      </div>
    </div>
  </header>

  <!-- PAINEL PRINCIPAL -->
  <main class="dashboard-container">
    
    <!-- CARDS DE ESTATÍSTICAS (CLICÁVEIS PARA FILTRAR) -->
    <section class="cards-grid">
      <div class="stat-card" id="card-agendados" onclick="filtrarPorStatus('Agendado')">
        <span class="qtd" id="cnt-agendados">0</span>
        <span class="label">AGENDADOS</span>
      </div>
      <div class="stat-card" id="card-pendentes" onclick="filtrarPorStatus('Pendente')">
        <span class="qtd" id="cnt-pendentes">0</span>
        <span class="label">PENDENTES</span>
      </div>
      <div class="stat-card" id="card-execucao" onclick="filtrarPorStatus('Em execução')">
        <span class="qtd" id="cnt-execucao">0</span>
        <span class="label">EM EXECUÇÃO</span>
      </div>
      <div class="stat-card" id="card-concluidos" onclick="filtrarPorStatus('Concluído')">
        <span class="qtd" id="cnt-concluidos">0</span>
        <span class="label">CONCLUÍDOS</span>
      </div>
    </section>

    <!-- BARRA DE PESQUISA E AÇÕES -->
    <section class="actions-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar por nome, local ou responsável..." oninput="filtrarServicos()">
      </div>

      <div class="buttons-group">
        <button type="button" id="btn-backup" class="btn-secundario" onclick="fazerBackup()">💾 Backup</button>
        <button type="button" id="btn-importar" class="btn-secundario" onclick="importarDados()">📊 Importar</button>
        <button type="button" class="btn-novo-servico" onclick="abrirModalNovoServico()">+ Novo Serviço</button>
      </div>
    </section>

    <!-- CABEÇALHO DA LISTA E CONTAINER DOS SERVIÇOS -->
    <section class="services-section">
      <h2 id="titulo-lista">Serviços recentes</h2>
      <div id="lista-servicos" class="services-list">
        <!-- Renderizado via JS -->
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criatório Marques - AgroGestão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO PRINCIPAL -->
  <header class="header-container">
    <div class="brand-box">
      <div class="brand-avatar">CM</div>
      <div>
        <h1>CRIATÓRIO MARQUES</h1>
        <p class="brand-sub">AgroGestão • Serviços da Propriedade</p>
        <p class="brand-slogan">"A VITRINE DO BÔER"</p>
      </div>
    </div>
    
    <div class="header-right">
      <span class="status-badge"><span class="dot"></span> Online</span>
      <div class="weather-widget">☀️ Belém do São Francisco - PE</div>
    </div>
  </header>

  <main class="dashboard-container">
    
    <!-- PAINEL DE RESUMO / FILTROS -->
    <section class="cards-grid">
      <div class="stat-card" onclick="filtrarStatus('Todos')">
        <span class="qtd" id="cnt-todos">0</span>
        <span class="label">TODOS</span>
      </div>
      <div class="stat-card" onclick="filtrarStatus('Pendente')">
        <span class="qtd" id="cnt-pendentes">0</span>
        <span class="label">PENDENTES</span>
      </div>
      <div class="stat-card" onclick="filtrarStatus('Em execução')">
        <span class="qtd" id="cnt-execucao">0</span>
        <span class="label">EM EXECUÇÃO</span>
      </div>
      <div class="stat-card" onclick="filtrarStatus('Concluído')">
        <span class="qtd" id="cnt-concluidos">0</span>
        <span class="label">CONCLUÍDOS</span>
      </div>
    </section>

    <!-- FORMULÁRIO DE NOVO SERVIÇO -->
    <section class="card-box">
      <h2>+ Cadastrar Novo Serviço</h2>
      <form id="form-servico" onsubmit="adicionarServico(event)" class="form-grid">
        <input type="text" id="nome-servico" placeholder="Nome do serviço (ex: Vacinação, Manejo, Cerca)" required>
        <input type="text" id="local-servico" placeholder="Local / Setor (ex: Piquete 02, Curral)" required>
        <input type="text" id="responsavel-servico" placeholder="Responsável" required>
        <select id="status-servico">
          <option value="Pendente">Pendente</option>
          <option value="Em execução">Em execução</option>
          <option value="Concluído">Concluído</option>
        </select>
        <button type="submit" class="btn-primary">Salvar Serviço</button>
      </form>
    </section>

    <!-- LISTA DE SERVIÇOS -->
    <section class="card-box">
      <div class="list-header">
        <h2 id="titulo-lista">Serviços Cadastrados</h2>
        <input type="text" id="search-input" placeholder="🔍 Pesquisar serviço..." oninput="renderizarServicos()">
      </div>
      <div id="lista-servicos" class="services-list">
        <!-- Renderizado dinamicamente via JS -->
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>

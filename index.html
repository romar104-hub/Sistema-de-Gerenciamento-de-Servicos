<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criatório Marques - Gestão de Serviços</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2e5a3c">
  <style>
    .card { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-2px); }
    .card.ativo { border: 2px solid #2e5a3c; background-color: #f0f7f2; }
  </style>
</head>
<body>

  <header class="header">
    <h1>CRIATÓRIO MARQUES</h1>
    <h2>Serviços da propriedade</h2>
  </header>

  <main class="container">
    <section class="cards-grid">
      <div class="card" id="card-pendentes" onclick="filtrarPorStatus('Pendente')">
        <span class="num" id="count-pendentes">0</span>
        <span class="label">pendentes</span>
      </div>
      <div class="card" id="card-execucao" onclick="filtrarPorStatus('Em execução')">
        <span class="num" id="count-execucao">0</span>
        <span class="label">em execução</span>
      </div>
      <div class="card" id="card-concluidos" onclick="filtrarPorStatus('Concluído')">
        <span class="num" id="count-concluidos">0</span>
        <span class="label">concluídos</span>
      </div>
    </section>

    <section class="toolbar">
      <input type="text" id="search-input" placeholder="🔍 Buscar por nome, local ou responsável..." oninput="filtrarServicos()">
      <div class="backup-actions">
        <button onclick="exportarBackup()" class="btn-secondary">💾 Exportar Backup</button>
        <label for="import-file" class="btn-secondary">📅 Importar Backup</label>
        <input type="file" id="import-file" accept=".json" onchange="importarBackup(event)" style="display:none;">
      </div>
    </section>

    <section class="services-header">
      <h3 id="titulo-lista">Serviços recentes</h3>
      <button class="btn-primary" onclick="abrirModal()">+ Novo</button>
    </section>

    <div id="lista-servicos" class="services-list"></div>
  </main>

  <!-- MODAL / FICHA DE NOVO SERVIÇO -->
  <div id="modal-servico" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📋 Ficha de Serviço</h3>
        <button type="button" class="btn-close" onclick="fecharModal()">✕</button>
      </div>
      
      <form id="form-servico" onsubmit="salvarServicoFormulario(event)">
        <div class="form-group">
          <label for="nome-servico">Nome do Serviço *</label>
          <input type="text" id="nome-servico" placeholder="Ex: Vacinação, Reparo de Cerca" required>
        </div>

        <div class="form-group">
          <label for="local-servico">Local da Propriedade</label>
          <input type="text" id="local-servico" placeholder="Ex: Curral, Pasto 1, Galinheiro">
        </div>

        <div class="form-group">
          <label for="responsavel-servico">Responsável</label>
          <input type="text" id="responsavel-servico" placeholder="Ex: João, Romerio">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prioridade-servico">Prioridade</label>
            <select id="prioridade-servico">
              <option value="Normal">Normal</option>
              <option value="Alta">Alta</option>
              <option value="Baixa">Baixa</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="obs-servico">Observações / Orientações</label>
          <textarea id="obs-servico" rows="3" placeholder="Detalhes ou orientações sobre a tarefa..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar Ficha</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE JUSTIFICATIVA (AO PAUSAR PARA PENDENTE) -->
  <div id="modal-justificativa" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚠️ Justificativa de Pausa</h3>
        <button type="button" class="btn-close" onclick="fecharModalJustificativa()">✕</button>
      </div>
      <div class="form-group">
        <label for="texto-justificativa">Motivo para pausar a execução *</label>
        <textarea id="texto-justificativa" rows="3" placeholder="Ex: Faltou material, chuva forte..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" onclick="fecharModalJustificativa()">Cancelar</button>
        <button type="button" class="btn-primary" onclick="confirmarPausaServico()">Confirmar Pausa</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CONCLUSÃO DE SERVIÇO -->
  <div id="modal-conclusao" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>✅ Conclusão do Serviço</h3>
        <button type="button" class="btn-close" onclick="fecharModalConclusao()">✕</button>
      </div>
      <form id="form-conclusao" onsubmit="confirmarConclusaoServico(event)">
        <div class="form-group">
          <label for="relatorio-conclusao">Informações da Conclusão *</label>
          <textarea id="relatorio-conclusao" rows="3" placeholder="Descreva o que foi realizado, quantidade de insumos gastos, etc..." required></textarea>
        </div>
        <div class="form-group">
          <label for="fotos-conclusao">Comprovantes / Fotos da Execução</label>
          <input type="file" id="fotos-conclusao" accept="image/*" multiple onchange="carregarImagensConclusao(event)">
          <div id="preview-imagens" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="fecharModalConclusao()">Cancelar</button>
          <button type="submit" class="btn-primary" style="background: #27ae60;">Finalizar e Concluir</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

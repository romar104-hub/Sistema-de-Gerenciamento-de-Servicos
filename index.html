<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criatório Marques - Gestão de Serviços</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2e5a3c">
</head>
<body>

  <header class="header">
    <h1>CRIATÓRIO MARQUES</h1>
    <h2>Serviços da propriedade</h2>
  </header>

  <main class="container">
    <!-- Métricas -->
    <section class="cards-grid">
      <div class="card"><span class="num" id="count-pendentes">0</span><span class="label">pendentes</span></div>
      <div class="card"><span class="num" id="count-execucao">0</span><span class="label">em execução</span></div>
      <div class="card"><span class="num" id="count-concluidos">0</span><span class="label">concluídos</span></div>
    </section>

    <!-- Barra de Ferramentas: Busca e Backup -->
    <section class="toolbar">
      <input type="text" id="search-input" placeholder="🔍 Buscar por nome, local ou responsável..." oninput="filtrarServicos()">
      <div class="backup-actions">
        <button onclick="exportarBackup()" class="btn-secondary">💾 Exportar Backup</button>
        <label for="import-file" class="btn-secondary">📅 Importar Backup</label>
        <input type="file" id="import-file" accept=".json" onchange="importarBackup(event)" style="display:none;">
      </div>
    </section>

    <!-- Lista de Serviços -->
    <section class="services-header">
      <h3>Serviços recentes</h3>
      <button class="btn-primary" onclick="abrirModal()">+ Novo</button>
    </section>

    <div id="lista-servicos" class="services-list">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
